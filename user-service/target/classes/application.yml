server:
  port: 9991
  servlet:
    context-path: /user-service

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/userdb
    username: root
    password: 123456

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    url: jdbc:mysql://localhost:3307/userdb
    user: root
    password: 123456
    table: migrations
    locations: classpath:db/migrations
    validate-on-migrate: true
    clean-disabled: true
